name: Update Template Workflows

on:
  schedule:
    - cron: "0 1 * * 0" # Run weekly on Sunday at 01:00 UTC (staggered 1h after update_template_deps.yml / Dependabot to avoid stale-branch collisions)
  workflow_dispatch: # Allow manual trigger

jobs:
  update-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_template_workflows.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          commit-message: "chore: update template workflow action versions"
          title: "chore: update template workflow action versions"
          body: |
            This PR updates the GitHub Actions versions used in
            `{{cookiecutter.repo_name}}/.github/workflows/*.yml` to their latest
            available tags.

            Dependabot cannot target this folder directly because its `directory`
            option rejects paths containing glob-like characters (the `{{ }}` in
            the cookiecutter folder name is interpreted as a glob brace pattern),
            so this workflow replicates that update behaviour via
            `scripts/update_template_workflows.py`.

            Auto-generated by the `update_template_workflows.yml` workflow.
          branch: update-template-workflows
          delete-branch: true
          base: main

      - name: Add label
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: 'update-template-workflows'
            });
            if (pullRequests.length > 0) {
              const prNumber = pullRequests[0].number;
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['automerge']
              });
            }
